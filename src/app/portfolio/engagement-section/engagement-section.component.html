<section data-testid="engagement-section" aria-labelledby="engagement-heading">
  <app-section-header
    eyebrow="01 — How I Engage"
    heading="Ways to work together."
    headingId="engagement-heading"
  />

  <div class="tiles">
    @for (path of engagementPaths; track path.id) {
      <div [attr.data-testid]="'engagement-path-' + path.id" class="tile">
        <span class="eyebrow">{{ path.eyebrow | nonBreakingTerms }}</span>
        <h3>{{ path.title | nonBreakingTerms }}</h3>
        <p>{{ path.description | nonBreakingTerms }}</p>
      </div>
    }
  </div>
</section>
