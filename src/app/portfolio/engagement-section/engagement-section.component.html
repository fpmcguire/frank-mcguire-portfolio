<section data-testid="engagement-section" aria-labelledby="engagement-heading">
  <h2 id="engagement-heading">Two ways to work together.</h2>

  <div class="tiles">
    @for (path of engagementPaths; track path.id) {
      <div [attr.data-testid]="'engagement-path-' + path.id" class="tile">
        <span class="eyebrow">{{ path.eyebrow }}</span>
        <h3>{{ path.title }}</h3>
        <p>{{ path.description }}</p>
      </div>
    }
  </div>
</section>
